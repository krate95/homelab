apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-provisioner
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      sourceRef:
        kind: HelmRepository
        name: nfs-provisioner
        namespace: flux-system
  values:
    priorityClassName: homelab-critical
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: homelab/performance
                  operator: In
                  values:
                    - low

    nfs:
      server: ${NFS_SERVER_IP}
      path: ${NFS_SERVER_PATH}

    storageClass:
      create: true
      defaultClass: true
      name: nfs-client
      reclaimPolicy: Retain

    podSecurityPolicy:
      enabled: false
