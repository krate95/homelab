apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: traefik
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: "41.5.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      kind: DaemonSet
    priorityClassName: homelab-critical
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    ports:
      forgejo-ssh:
        port: 2222
        expose:
          default: true
        exposedPort: 2222
        protocol: TCP
    service:
      spec:
        externalTrafficPolicy: Local
