apiVersion: v1
kind: ServiceAccount
metadata:
  name: ip-updater
  namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ip-updater
  namespace: external-dns
rules:
  - apiGroups:
      - "externaldns.k8s.io"
    resources:
      - "dnsendpoints"
    verbs:
      - "create"
  - apiGroups:
      - "externaldns.k8s.io"
    resources:
      - "dnsendpoints"
    resourceNames:
      - "wildcard"
    verbs:
      - "get"
      - "patch"
      - "update"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ip-updater
  namespace: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ip-updater
subjects:
  - kind: ServiceAccount
    name: ip-updater
    namespace: external-dns
