# https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ip-updater
  namespace: external-dns
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          priorityClassName: homelab-critical
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: homelab/performance
                        operator: In
                        values:
                          - low
          serviceAccountName: ip-updater
          restartPolicy: OnFailure
          containers:
            - name: ip-updater
              image: alpine/k8s:1.37.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  PUBLIC_IP=$(curl -s https://ifconfig.me)
                  if [ -z "$PUBLIC_IP" ]; then
                    echo "No se pudo obtener la IP pública"
                    exit 1
                  fi
                  echo "IP pública: $PUBLIC_IP"
                  cat <<EOF | kubectl apply -f -
                  apiVersion: externaldns.k8s.io/v1alpha1
                  kind: DNSEndpoint
                  metadata:
                    name: wildcard
                    namespace: external-dns
                  spec:
                    endpoints:
                      - dnsName: "*.${BASE_DOMAIN}"
                        recordType: A
                        targets:
                          - "$PUBLIC_IP"
                  EOF
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
