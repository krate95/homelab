apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Roshar Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    useEqualHeights: true
    hideVersion: true
    target: _blank
    layout:
      Network:
        style: row
        columns: 4
      Apps:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
      Servers:
        style: row
        columns: 2
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Homelab GitOps:
            - abbr: HL
              href: https://github.com/krate95/homelab
        - Github:
            - abbr: GH
              href: https://github.com/krate95
  services.yaml: |
    - Network:
        - Router:
            href: https://192.168.1.1:8443/
            description: Asus router
        - AdGuard:
            href: http://192.168.1.212/
            description: AdGuard control panel
            icon: sh-adguard-home.webp
        - NPM:
            href: http://192.168.1.9:81
            description: Nginx Proxy Manager
            icon: sh-nginx-proxy-manager.webp

    - Apps:
        - Homepage:
            href: https://home.${BASE_DOMAIN}
            description: Homepage dashboard
            icon: sh-homepage.webp
        - Forgejo:
            href: https://${FORGEJO_DOMAIN}
            description: Servidor Git Forgejo
            icon: sh-forgejo.webp
        - n8n:
            href: https://n8n.${BASE_DOMAIN}
            description: Automatizacion de flujos
            icon: sh-n8n.webp
        - Miniflux:
            href: https://miniflux.${BASE_DOMAIN}
            description: Lector de feeds RSS
            icon: sh-miniflux.webp
        - Dawarich:
            href: https://dawarich.${BASE_DOMAIN}
            description: Historial de ubicaciones
            icon: sh-dawarich.webp
        - Hermes:
            href: https://hermes.${BASE_DOMAIN}
            description: Agente de IA local
            icon: mdi-robot-happy-outline
        - IT-Tools:
            href: https://tools.${BASE_DOMAIN}
            description: Herramientas IT
            icon: sh-it-tools.webp
        - OpenSpeedTest:
            href: https://speedtest.${BASE_DOMAIN}
            description: Test de velocidad
            icon: sh-openspeedtest.webp
        - WgDashboard:
            href: https://wg.${BASE_DOMAIN}
            description: WireGuard dashboard
            icon: sh-wgdashboard.webp
        - Crafty:
            href: https://crafty.${BASE_DOMAIN}
            description: Minecraft server controller
            icon: sh-crafty-controller.webp
        - TRMNL:
            href: https://trmnl.${BASE_DOMAIN}
            description: LaraPaper e-ink display server
            icon: sh-trmnl.webp

    - Infrastructure:
        - Grafana:
            href: https://grafana.${BASE_DOMAIN}
            description: Metricas y observabilidad
            icon: sh-grafana.webp
        - Longhorn:
            href: https://longhorn.${BASE_DOMAIN}
            description: Almacenamiento distribuido
            icon: mdi-harddisk
        - Docker Registry:
            href: https://registry.${BASE_DOMAIN}
            description: Registro privado de imagenes
            icon: sh-docker.webp
        - Whoami:
            href: https://whoami.${BASE_DOMAIN}
            description: Diagnostico de Traefik
            icon: sh-traefik.webp

    - Servers:
        - Tecnospren:
            href: https://192.168.1.3:8006/
            description: Proxmox VE
            icon: sh-proxmox.webp
            widget:
              type: proxmox
              url: https://192.168.1.3:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
              node: tecnospren
        - Mentecobre:
            href: http://192.168.1.2
            description: openmediavault
            icon: sh-openmediavault.webp
            widget:
              type: openmediavault
              url: http://192.168.1.2
              username: "{{HOMEPAGE_VAR_OMV_USERNAME}}"
              password: "{{HOMEPAGE_VAR_OMV_PASSWORD}}"
              method: services.getStatus # required

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: |
    tecnospren:
      url: https://192.168.1.3:8006
      token: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
      secret: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
