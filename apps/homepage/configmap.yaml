apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Roshar Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    useEqualHeights: true
    hideVersion: true
    target: _blank
    layout:
      Network:
        style: row
        columns: 4
      Apps:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
      Servers:
        style: row
        columns: 2
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Homelab GitOps:
            - abbr: HL
              href: https://github.com/krate95/homelab
        - Github:
            - abbr: GH
              href: https://github.com/krate95
  services.yaml: |
    - Network:
        - Router:
            href: "{{HOMEPAGE_VAR_ROUTER_URL}}"
            description: Asus router
        - AdGuard:
            href: http://${ADGUARD_LB_IP}/
            description: AdGuard control panel
            icon: sh-adguard-home.webp

    - Apps:
        - Forgejo:
            href: https://${FORGEJO_DOMAIN}
            description: Servidor Git Forgejo
            icon: sh-forgejo.webp
        - n8n:
            href: https://n8n.${BASE_DOMAIN}
            description: Automatizacion de flujos
            icon: sh-n8n.webp
        - Miniflux:
            href: https://miniflux.${BASE_DOMAIN}
            description: Lector de feeds RSS
            icon: sh-miniflux.webp
        - Dawarich:
            href: https://dawarich.${BASE_DOMAIN}
            description: Historial de ubicaciones
            icon: sh-dawarich.webp
        - IT-Tools:
            href: https://it-tools.${BASE_DOMAIN}
            description: Herramientas IT
            icon: sh-it-tools.webp
        - OmniTools:
            href: https://omni-tools.${BASE_DOMAIN}
            description: Herramientas de ficheros y utilidades
            icon: sh-omnitools.webp
        - OpenSpeedTest:
            href: https://speedtest.${BASE_DOMAIN}
            description: Test de velocidad
            icon: sh-openspeedtest.webp
        - SearXNG:
            href: https://search.${BASE_DOMAIN}
            description: Buscador web
            icon: sh-searxng.webp

    - Infrastructure:
        - Longhorn:
            href: https://longhorn-talos.${BASE_DOMAIN}
            description: Almacenamiento distribuido
            icon: sh-longhorn.webp

    - Servers:
        - Tecnospren:
            href: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
            description: Proxmox VE
            icon: sh-proxmox.webp
            widget:
              type: proxmox
              url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
              node: tecnospren
        - Mentecobre:
            href: "{{HOMEPAGE_VAR_OMV_URL}}"
            description: openmediavault
            icon: sh-openmediavault.webp
            widget:
              type: openmediavault
              url: "{{HOMEPAGE_VAR_OMV_URL}}"
              username: "{{HOMEPAGE_VAR_OMV_USERNAME}}"
              password: "{{HOMEPAGE_VAR_OMV_PASSWORD}}"
              method: services.getStatus # required

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
