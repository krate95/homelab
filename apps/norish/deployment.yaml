apiVersion: apps/v1
kind: Deployment
metadata:
  name: norish
  namespace: norish
  labels:
    app: norish
spec:
  revisionHistoryLimit: 3
  replicas: 1
  # The uploads volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: norish
  template:
    metadata:
      labels:
        app: norish
    spec:
      priorityClassName: homelab-medium
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Started as a non-root user, the entrypoint skips its chown of the uploads
      # folder and runs the server directly; the NAS folder is already 1000:1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab/performance
                    operator: In
                    values:
                      - medium
      containers:
        - name: norish
          image: norishapp/norish:v0.26.1-beta
          imagePullPolicy: IfNotPresent
          # Root filesystem left writable: it is not documented where Next.js and
          # yt-dlp write at runtime. Worth trying readOnlyRootFilesystem later.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # DATABASE_URL, MASTER_KEY (derives the encryption keys, must never change),
          # OBSCURA_CDP_TOKEN and AI_API_KEY (OpenRouter), SOPS-encrypted.
          envFrom:
            - secretRef:
                name: norish-secret
          env:
            - name: AUTH_URL
              value: https://norish.${BASE_DOMAIN}
            - name: VALKEY_URL
              value: valkey://valkey:6379
            - name: OBSCURA_ENDPOINT
              value: ws://obscura:9222
            # Recipe parsing (pages the scraper can't read, text, photos, video
            # transcripts) and enrichment through OpenRouter.
            - name: AI_ENABLED
              value: "true"
            - name: AI_ENDPOINT
              value: https://openrouter.ai/api/v1
            - name: AI_MODEL
              value: openai/gpt-6-luna
            # Lower than the default 1.0 so the structured output stays stable.
            - name: AI_TEMPERATURE
              value: "0.2"
            # Video import: yt-dlp downloads it, Whisper transcribes the audio and
            # the AI provider reads the recipe from the transcript.
            - name: VIDEO_PARSING_ENABLED
              value: "true"
            - name: VIDEO_MAX_LENGTH_SECONDS
              value: "600"
            # whisper.cpp's server on the Mac mini (OpenAI-compatible, outside the cluster).
            - name: TRANSCRIPTION_PROVIDER
              value: generic-openai
            - name: TRANSCRIPTION_ENDPOINT
              value: http://${MAC_MINI_IP}:8080/v1
            # whisper.cpp ignores the model name.
            - name: TRANSCRIPTION_MODEL
              value: whisper-1
            # whisper.cpp needs no key, but an empty one makes Norish fall back to
            # AI_API_KEY and send the OpenRouter key to the Mac.
            - name: TRANSCRIPTION_API_KEY
              value: local
            - name: UPLOADS_DIR
              value: /app/uploads
            - name: TZ
              value: Europe/Madrid
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # ready = database and Valkey answer; live = the server and its parser answer.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: norish-uploads
