apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: norish
  namespace: norish
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-local-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: norish.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: norish
                port:
                  number: 3000
