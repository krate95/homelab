apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-dawarich-photon-data
spec:
  capacity:
    storage: 150Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: ${NFS_SERVER_IP}
    path: ${NFS_SERVER_PATH}/photon
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-photon-data
  namespace: dawarich
spec:
  storageClassName: ""
  volumeName: pv-dawarich-photon-data
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 150Gi
