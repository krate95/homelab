apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-app
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dawarich-app
  template:
    metadata:
      labels:
        app: dawarich-app
        app.kubernetes.io/name: dawarich
        app.kubernetes.io/component: app
    spec:
      priorityClassName: homelab-medium
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab/performance
                    operator: In
                    values:
                      - high
      containers:
        - name: dawarich-app
          image: freikin/dawarich:1.15.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - web-entrypoint.sh
          args:
            - bin/rails
            - server
            - -p
            - "3000"
            - -b
            - "::"
          envFrom:
            - configMapRef:
                name: dawarich-config
            - secretRef:
                name: dawarich-secret
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'wget -qO - --header="X-Forwarded-Proto: https" http://127.0.0.1:3000/api/v1/health | grep -q ''"status"[[:space:]]*:[[:space:]]*"ok"'''
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              scheme: HTTP
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: dawarich-public
              mountPath: /var/app/public
            - name: dawarich-watched
              mountPath: /var/app/tmp/imports/watched
            - name: dawarich-storage
              mountPath: /var/app/storage

        - name: dawarich-sidekiq
          image: freikin/dawarich:1.15.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sidekiq-entrypoint.sh
          args:
            - sidekiq
          envFrom:
            - configMapRef:
                name: dawarich-config
            - secretRef:
                name: dawarich-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f sidekiq
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: dawarich-public
              mountPath: /var/app/public
            - name: dawarich-watched
              mountPath: /var/app/tmp/imports/watched
            - name: dawarich-storage
              mountPath: /var/app/storage
      restartPolicy: Always
      volumes:
        - name: dawarich-public
          persistentVolumeClaim:
            claimName: dawarich-public-longhorn
        - name: dawarich-watched
          persistentVolumeClaim:
            claimName: dawarich-watched-longhorn
        - name: dawarich-storage
          persistentVolumeClaim:
            claimName: dawarich-storage-longhorn
