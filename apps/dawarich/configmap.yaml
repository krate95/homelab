apiVersion: v1
kind: ConfigMap
metadata:
  name: dawarich-config
  namespace: dawarich
data:
  RAILS_ENV: production
  REDIS_URL: redis://dawarich-redis:6379
  DATABASE_HOST: dawarich-db
  DATABASE_PORT: "5432"
  APPLICATION_HOSTS: dawarich.${BASE_DOMAIN},localhost,::1,127.0.0.1
  TIME_ZONE: Europe/Madrid
  APPLICATION_PROTOCOL: https
  PROMETHEUS_EXPORTER_ENABLED: "false"
  RAILS_LOG_TO_STDOUT: "true"
  SELF_HOSTED: "true"
  STORE_GEODATA: "true"
  PHOTON_API_HOST: dawarich-photon:2322
  PHOTON_API_USE_HTTPS: "false"
  BACKGROUND_PROCESSING_CONCURRENCY: "5"
