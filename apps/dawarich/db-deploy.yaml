apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-db
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich
    app.kubernetes.io/component: database
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dawarich-db
  template:
    metadata:
      labels:
        app: dawarich-db
    spec:
      priorityClassName: homelab-medium
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab/performance
                    operator: In
                    values:
                      - high
      containers:
        - name: dawarich-db
          image: postgis/postgis:17-3.5-alpine
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: dawarich-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: dawarich-shared
              mountPath: /var/shared
            - name: dawarich-db-data
              mountPath: /var/lib/postgresql/data

      restartPolicy: Always
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dawarich-shared
          persistentVolumeClaim:
            claimName: dawarich-shared-longhorn
        - name: dawarich-db-data
          persistentVolumeClaim:
            claimName: dawarich-db-data-longhorn
