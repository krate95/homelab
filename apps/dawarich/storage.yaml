apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-db-data-longhorn
  namespace: dawarich
spec:
  storageClassName: longhorn-rwo-retain
  resources:
    requests:
      storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
