apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets/forgejo-secret.yaml
  - pvc.yaml
  - deployment.yaml
  # - networkpolicy.yaml

# Generated with a content hash in its name, so any change to config.yaml
# rolls the runner pod (a plain ConfigMap change would not restart it).
configMapGenerator:
  - name: forgejo-runner-config
    namespace: forgejo-runner
    files:
      - config.yaml

