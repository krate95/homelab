apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-config-longhorn
  namespace: forgejo
spec:
  storageClassName: longhorn-rwo-retain
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data-longhorn
  namespace: forgejo
spec:
  storageClassName: longhorn-rwo-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-git-nfs
  namespace: forgejo
  labels:
    app: forgejo-git-nfs
spec:
  storageClassName: nfs-client
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# https://kubernetes.io/docs/concepts/storage/persistent-volumes/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-lfs-nfs
  namespace: forgejo
  labels:
    app: forgejo-lfs-nfs
spec:
  storageClassName: nfs-client
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
