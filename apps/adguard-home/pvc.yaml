apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-conf-longhorn
  namespace: adguard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-rwo-retain
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-work-longhorn
  namespace: adguard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-rwo-retain
  volumeMode: Filesystem
  resources:
    requests:
      storage: 20Gi
