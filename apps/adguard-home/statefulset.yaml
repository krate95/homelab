apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adguard
  namespace: adguard
  labels:
    app: adguard
spec:
  serviceName: adguard
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      priorityClassName: homelab-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: type
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: adguard
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: homelab/performance
                    operator: In
                    values:
                      - "low"
              weight: 100
      initContainers:
        - name: load-config
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - "ALL"
          command:
            ["sh", "-c", "cp /src/AdGuardHome.yaml /conf/AdGuardHome.yaml"]
          volumeMounts:
            - mountPath: /src
              readOnly: true
              name: config-src
            - mountPath: /conf
              name: conf
      containers:
        - name: adguardhome
          image: adguard/adguardhome:v0.107.79
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
              add:
                - "NET_BIND_SERVICE"
          args: ["--no-check-update"]
          ports:
            - { name: http, containerPort: 80 }
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
          volumeMounts:
            - { name: conf, mountPath: /opt/adguardhome/conf }
            - { name: work, mountPath: /opt/adguardhome/work }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 300m, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config-src
          secret:
            secretName: adguard-home-config
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: longhorn-rwo-retain
        resources:
          requests:
            storage: 5Gi
