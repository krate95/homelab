apiVersion: v1
kind: Service
metadata:
  name: adguard
  namespace: adguard
spec:
  clusterIP: None
  selector:
    app: adguard
  ports:
    - { name: http, port: 80 }
    - { name: dns-udp, port: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: adguard
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.16
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: adguard
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-http
  namespace: adguard
spec:
  type: ClusterIP
  selector:
    app: adguard
  ports:
    - { name: http, port: 80, targetPort: 80 }
