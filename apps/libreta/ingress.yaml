apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: libreta
  namespace: libreta
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-local-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: libreta.${BASE_DOMAIN}
      http:
        paths:
          - backend:
              service:
                name: libreta
                port:
                  number: 3000
            path: /
            pathType: Prefix
