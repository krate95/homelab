apiVersion: apps/v1
kind: Deployment
metadata:
  name: openspeedtest
  namespace: openspeedtest
  labels:
    app.kubernetes.io/name: openspeedtest
    app.kubernetes.io/instance: openspeedtest
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openspeedtest

  template:
    metadata:
      labels:
        app.kubernetes.io/name: openspeedtest
        app.kubernetes.io/instance: openspeedtest
        app.kubernetes.io/component: server
        policy-type: "app"

    spec:
      priorityClassName: homelab-low
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab/performance
                    operator: In
                    values:
                      - low
      containers:
        - name: openspeedtest
          image: openspeedtest/latest:v2.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP

          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"

      restartPolicy: Always
