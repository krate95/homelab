apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adguard-home
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/adguard-home
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure
    - name: metallb-config
    - name: traefik-config
    - name: cert-manager-config
    - name: cluster-vars
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
---
